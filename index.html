<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Invoify - Professional Contract & Invoice Generator</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] },
        }
      }
    }
  </script>
  <!-- FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
  <!-- jsPDF Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 transition-colors duration-300 min-h-screen flex flex-col font-sans">

  <!-- Navbar -->
  <header class="sticky top-0 z-50 border-b border-slate-200 dark:border-slate-800 bg-white/80 dark:bg-slate-900/80 backdrop-blur-md">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <div class="flex items-center gap-3 cursor-pointer" onclick="switchTab('generator')">
        <div class="h-10 w-10 rounded-xl bg-blue-600 text-white flex items-center justify-center font-bold text-lg shadow-lg shadow-blue-500/30">
          <i class="fa-solid fa-bolt"></i>
        </div>
        <div>
          <span class="font-black text-xl tracking-tight bg-gradient-to-r from-blue-600 to-indigo-600 bg-clip-text text-transparent">Invoify</span>
          <span class="block text-[10px] uppercase font-bold tracking-widest text-slate-400">Ahmad Builds</span>
        </div>
      </div>

      <div class="flex items-center gap-3">
        <button id="themeToggle" class="h-10 w-10 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-100 dark:bg-slate-800 flex items-center justify-center hover:scale-105 transition">
          <i class="fa-solid fa-moon dark:hidden text-slate-700"></i>
          <i class="fa-solid fa-sun hidden dark:block text-amber-400"></i>
        </button>
        <button id="newDocBtn" class="inline-flex items-center gap-2 px-4 py-2 rounded-xl bg-blue-600 text-white font-semibold text-sm shadow-lg shadow-blue-600/20 hover:bg-blue-700 transition">
          <i class="fa-solid fa-plus"></i> New Doc
        </button>
      </div>
    </div>
  </header>

  <!-- Main Container -->
  <main class="flex-grow max-w-7xl mx-auto w-full px-4 sm:px-6 lg:px-8 py-8">
    <div id="view-generator" class="grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">
      
      <!-- Left Inputs -->
      <div class="lg:col-span-5 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-3xl p-6 shadow-xl">
        <div class="flex items-center justify-between mb-6">
          <h2 class="text-lg font-bold">Document Config</h2>
          <select id="templateType" class="bg-slate-100 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-xs font-semibold rounded-lg px-3 py-2 outline-none">
            <option value="invoice">Invoice Template</option>
            <option value="contract">Service Agreement</option>
          </select>
        </div>

        <div class="space-y-4">
          <div>
            <label class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-1">Freelancer / Your Name</label>
            <input type="text" id="inpFreelancer" value="Ahmad" class="w-full bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 rounded-xl px-4 py-2.5 text-sm outline-none focus:border-blue-500 transition" />
          </div>
          <div>
            <label class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-1">Client Name</label>
            <input type="text" id="inpClient" value="Global Tech Corp" class="w-full bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 rounded-xl px-4 py-2.5 text-sm outline-none focus:border-blue-500 transition" />
          </div>
          <div>
            <label class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-1">Project Scope & Description</label>
            <textarea id="inpScope" rows="3" class="w-full bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 rounded-xl px-4 py-2.5 text-sm outline-none focus:border-blue-500 transition">Full-stack web application development and UI/UX optimization.</textarea>
          </div>
          <div class="grid grid-cols-2 gap-4">
            <div>
              <label class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-1">Amount (USD)</label>
              <input type="number" id="inpAmount" value="750" class="w-full bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 rounded-xl px-4 py-2.5 text-sm outline-none focus:border-blue-500 transition" />
            </div>
            <div>
              <label class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-1">Due Date</label>
              <input type="date" id="inpDate" class="w-full bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 rounded-xl px-4 py-2.5 text-sm outline-none focus:border-blue-500 transition cursor-pointer" />
            </div>
          </div>
        </div>

        <button id="downloadPdfBtn" class="mt-6 w-full py-3 px-4 rounded-xl bg-blue-600 hover:bg-blue-700 text-white font-bold text-sm shadow-lg shadow-blue-600/20 flex items-center justify-center gap-2 transition">
          <i class="fa-solid fa-file-pdf"></i> Download Official PDF
        </button>
      </div>

      <!-- Right Preview (Stylish UI Card) -->
      <div class="lg:col-span-7 bg-slate-200 dark:bg-slate-900/50 border border-slate-300 dark:border-slate-800 rounded-3xl p-6 flex flex-col items-center justify-center min-h-[600px] shadow-inner">
        <div id="previewCard" class="bg-white text-slate-900 w-full max-w-xl rounded-2xl shadow-2xl p-8 border border-slate-100 transition-all">
          <div id="previewContent"></div>
        </div>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="border-t border-slate-200 dark:border-slate-800 py-8 mt-12 bg-white/50 dark:bg-slate-900/50">
    <div class="max-w-7xl mx-auto px-4 flex flex-col sm:flex-row items-center justify-between gap-4 text-xs text-slate-500">
      <p>© 2026 Ahmad Builds. All rights reserved.</p>
      <div class="flex items-center gap-6 font-medium">
        <button onclick="openModal('about')" class="hover:text-blue-600 transition">About Us</button>
        <button onclick="openModal('privacy')" class="hover:text-blue-600 transition">Privacy Policy</button>
        <button onclick="openModal('terms')" class="hover:text-blue-600 transition">Terms of Use</button>
      </div>
    </div>
  </footer>

  <!-- Modal -->
  <div id="infoModal" class="fixed inset-0 z-50 hidden bg-black/60 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-3xl max-w-lg w-full p-6 shadow-2xl relative">
      <button onclick="closeModal()" class="absolute top-5 right-5 text-slate-400 hover:text-slate-100 text-lg">
        <i class="fa-solid fa-xmark"></i>
      </button>
      <div id="modalBody" class="space-y-4 text-sm text-slate-600 dark:text-slate-300"></div>
    </div>
  </div>

  <!-- Script logic -->
  <script>
    const { jsPDF } = window.jspdf;

    document.getElementById('themeToggle').addEventListener('click', () => {
      document.documentElement.classList.toggle('dark');
    });

    document.getElementById('newDocBtn').addEventListener('click', () => {
      document.getElementById('inpFreelancer').value = 'Ahmad';
      document.getElementById('inpClient').value = 'Global Tech Corp';
      document.getElementById('inpScope').value = 'Full-stack web application development and UI/UX optimization.';
      document.getElementById('inpAmount').value = '750';
      document.getElementById('inpDate').value = new Date().toISOString().split('T')[0];
      document.getElementById('templateType').value = 'invoice';
      updatePreview();
    });

    function openModal(type) {
      const modal = document.getElementById('infoModal');
      const body = document.getElementById('modalBody');
      modal.classList.remove('hidden');

      if (type === 'about') {
        body.innerHTML = `<h3 class="text-lg font-bold text-slate-900 dark:text-slate-100">About Invoify</h3><p>Invoify is a high-performance, client-side digital utility crafted under Ahmad Builds.</p>`;
      } else if (type === 'privacy') {
        body.innerHTML = `<h3 class="text-lg font-bold text-slate-900 dark:text-slate-100">Privacy Policy</h3><p>Your privacy is our priority. Invoify operates entirely inside your browser.</p>`;
      } else if (type === 'terms') {
        body.innerHTML = `<h3 class="text-lg font-bold text-slate-900 dark:text-slate-100">Terms of Use</h3><p>Templates provided are for general guidance and do not constitute formal legal counsel.</p>`;
      }
    }

    function closeModal() {
      document.getElementById('infoModal').classList.add('hidden');
    }

    ['inpFreelancer', 'inpClient', 'inpScope', 'inpAmount', 'inpDate', 'templateType'].forEach(id => {
      document.getElementById(id).addEventListener('input', updatePreview);
    });

    function updatePreview() {
      const f = document.getElementById('inpFreelancer').value || 'Ahmad';
      const c = document.getElementById('inpClient').value || 'Client';
      const s = document.getElementById('inpScope').value || '';
      const amt = document.getElementById('inpAmount').value || '0';
      const dt = document.getElementById('inpDate').value || '';
      const type = document.getElementById('templateType').value;

      const container = document.getElementById('previewContent');
      if (type === 'invoice') {
        container.innerHTML = `
          <div class="flex justify-between items-start border-b-2 border-blue-600 pb-6 mb-6">
            <div>
              <span class="text-xs font-extrabold uppercase tracking-widest text-blue-600">AHMAD BUILDS</span>
              <h2 class="text-3xl font-black mt-1 text-slate-900">INVOICE</h2>
            </div>
            <div class="text-right text-xs text-slate-500">
              <p><strong>Due Date:</strong> ${dt}</p>
              <p><strong>Invoice #:</strong> INV-001</p>
            </div>
          </div>
          <div class="grid grid-cols-2 gap-4 mb-6 text-sm bg-slate-50 p-4 rounded-xl border border-slate-100">
            <div><p class="text-xs font-bold text-slate-400">FROM</p><p class="font-bold text-slate-800">${f}</p></div>
            <div><p class="text-xs font-bold text-slate-400">BILLED TO</p><p class="font-bold text-slate-800">${c}</p></div>
          </div>
          <div class="border rounded-xl p-4 mb-6 bg-white shadow-sm text-sm border-slate-200">
            <p class="text-xs font-bold text-slate-400 mb-1">PROJECT SCOPE</p>
            <p class="font-medium text-slate-700">${s}</p>
          </div>
          <div class="flex justify-between items-center text-lg font-black border-t-2 border-slate-100 pt-4">
            <span class="text-slate-600">Total Due:</span>
            <span class="text-blue-600 text-2xl">$${amt} USD</span>
          </div>
        `;
      } else {
        container.innerHTML = `
          <div class="border-b-2 border-indigo-600 pb-4 mb-4">
            <span class="text-xs font-extrabold uppercase tracking-widest text-indigo-600">AHMAD BUILDS</span>
            <h2 class="text-2xl font-black mt-1 text-slate-900">SERVICE AGREEMENT</h2>
          </div>
          <div class="space-y-4 text-xs text-slate-700 leading-relaxed bg-slate-50 p-4 rounded-xl border border-slate-100">
            <p>This professional agreement is executed between <strong>${f}</strong> (Provider) and <strong>${c}</strong> (Client).</p>
            <p><strong>Scope of Work:</strong> ${s}</p>
            <p><strong>Compensation:</strong> Total agreed project fee is fixed at <strong>$${amt} USD</strong>, payable by ${dt}.</p>
          </div>
          <div class="grid grid-cols-2 gap-4 mt-8 pt-4 border-t-2 border-slate-100 text-xs font-bold">
            <div><p class="text-slate-800">${f}</p><p class="text-[10px] text-slate-400 font-normal">Provider Signature</p></div>
            <div><p class="text-slate-800">${c}</p><p class="text-[10px] text-slate-400 font-normal">Client Signature</p></div>
          </div>
        `;
      }
    }

    // Professional Stylish PDF Generation using jsPDF
    document.getElementById('downloadPdfBtn').addEventListener('click', () => {
      const doc = new jsPDF({ unit: 'mm', format: 'a4' });
      const f = document.getElementById('inpFreelancer').value || 'Ahmad';
      const c = document.getElementById('inpClient').value || 'Client';
      const s = document.getElementById('inpScope').value || '';
      const amt = document.getElementById('inpAmount').value || '0';
      const dt = document.getElementById('inpDate').value || '';
      const type = document.getElementById('templateType').value;

      // Decorative Top Header Bar
      doc.setFillColor(37, 99, 235); // Blue Accent
      doc.rect(0, 0, 210, 15, 'F');

      // Brand Title
      doc.setFont("helvetica", "bold");
      doc.setFontSize(22);
      doc.setTextColor(30, 41, 59);
      doc.text(type === 'invoice' ? "COMMERCIAL INVOICE" : "SERVICE AGREEMENT", 20, 32);

      doc.setFontSize(10);
      doc.setTextColor(100, 116, 139);
      doc.text("AHMAD BUILDS DIGITAL ASSET", 20, 24);

      // Thin Divider Line
      doc.setDrawColor(226, 232, 240);
      doc.setLineWidth(0.5);
      doc.line(20, 40, 190, 40);

      // From / Client Section Box
      doc.setFillColor(248, 250, 252);
      doc.roundedRect(20, 45, 170, 25, 3, 3, 'F');
      
      doc.setFontSize(9);
      doc.setTextColor(100, 116, 139);
      doc.text("FROM:", 25, 53);
      doc.text("BILLED TO:", 110, 53);

      doc.setFont("helvetica", "bold");
      doc.setFontSize(11);
      doc.setTextColor(30, 41, 59);
      doc.text(f, 25, 61);
      doc.text(c, 110, 61);

      // Due Date
      doc.setFont("helvetica", "normal");
      doc.setFontSize(10);
      doc.text(`Due Date: ${dt}`, 145, 32, { align: 'right' });

      // Project Scope Box
      doc.setFillColor(255, 255, 255);
      doc.setDrawColor(226, 232, 240);
      doc.roundedRect(20, 78, 170, 35, 3, 3, 'FD');

      doc.setFont("helvetica", "bold");
      doc.setFontSize(9);
      doc.setTextColor(100, 116, 139);
      doc.text("PROJECT SCOPE & DETAILS:", 25, 87);

      doc.setFont("helvetica", "normal");
      doc.setFontSize(10);
      doc.setTextColor(51, 65, 85);
      doc.text(s, 25, 96, { maxWidth: 160 });

      // Total Amount Section
      doc.setDrawColor(203, 213, 225);
      doc.line(20, 125, 190, 125);

      doc.setFont("helvetica", "bold");
      doc.setFontSize(12);
      doc.setTextColor(100, 116, 139);
      doc.text("Total Amount Due:", 20, 138);

      doc.setFontSize(20);
      doc.setTextColor(37, 99, 235);
      doc.text(`$${amt} USD`, 190, 138, { align: 'right' });

      // Footer note inside PDF
      doc.setFont("helvetica", "italic");
      doc.setFontSize(9);
      doc.setTextColor(148, 163, 184);
      doc.text("Generated securely via Ahmad Builds Toolkit. Thank you for your business!", 105, 275, { align: 'center' });

      doc.save(`${type}-ahmad-builds.pdf`);
    });

    document.getElementById('inpDate').value = new Date().toISOString().split('T')[0];
    updatePreview();
  </script>
</body>
</html>
